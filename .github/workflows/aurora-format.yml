name: Format Aurora upgrade source
on:
  push:
    branches: [feature/aurora-synth]
    paths:
      - '.github/workflows/aurora-format.yml'
      - 'src/**'
      - 'crates/audio/src/**'
permissions:
  contents: write
jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/aurora-synth
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt
      - name: Format Rust source
        run: cargo fmt --package honeydew --package honeydew-audio
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'Apply rustfmt to Aurora synthesizer and effects'
            git push origin HEAD:feature/aurora-synth
          fi
